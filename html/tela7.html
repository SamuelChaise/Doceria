<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contato - Amaricabelli Doceria</title>

    <link rel="stylesheet" href="../css/tela7.css">
</head>
<body>

    <header>
        <h1>📞 Contato</h1>

        <p class="slogan">
            Fale com a Amaricabelli Doceria
        </p>
    </header>

    <main class="container">

        <section class="contato">

            <div class="card-contato">
                <h2>📸 Instagram</h2>

                <p>
                    @amaricabelli.doceria
                </p>
            </div>

            <div class="card-contato">
                <h2>📱 Telefone</h2>

                <p>
                    (54) 99999-9999
                </p>
            </div>

            <div class="card-contato">
                <h2>🕒 Horário</h2>

                <p>
                    Segunda a Sexta – 08h às 18h
                </p>

                <p>
                    Sábado – 09h às 16h
                </p>
            </div>

        </section>

        <section class="mensagem-final">

            <h2>🍰 Obrigado pela visita!</h2>

            <p>
                Esperamos que tenha gostado de conhecer
                a Amaricabelli Doceria.
            </p>

        </section>

        <section class="botoes">

            <button onclick="window.location.href='../html/tela6.html'">
                ⬅ Voltar
            </button>

            <button onclick="window.location.href='../html/tela1.html'">
                🏠 Início
            </button>

        </section>

    </main>

</body>
</html>
